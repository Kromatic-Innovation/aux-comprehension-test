---
name: Eval - Live panel

# MANUAL ONLY. This workflow spends real tokens against real provider APIs.
# It must NEVER run on push or pull_request, and it must NEVER be added as a
# required check -- workflow_dispatch only. See eval/README.md.
#
# Credentials follow the same 1Password load-secrets pattern as the panelist
# repository's manual evals, with OP_SERVICE_ACCOUNT_TOKEN as the only
# repository secret needed. A repo without that token can instead set plain
# ANTHROPIC_API_KEY / OPENAI_API_KEY repository secrets; the 1Password step is
# skipped and the run step falls back to them. Either way, a key that does not
# resolve leaves its provider skipped and reported, not failed.

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: "Fixture to read"
        required: true
        type: choice
        options: [mini, neumann-before, neumann-after]
      models:
        description: "Comma-separated reader model ids (two providers for a possible pass)"
        required: true
        type: string
      max_usd:
        description: "Spend ceiling in USD (required, no default)"
        required: true
        type: string
      judge:
        description: "Judge model id (optional)"
        required: false
        type: string
      prices:
        description: "Price overrides as JSON (optional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  live-panel:
    name: Live panel (manual eval - spends tokens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund

      # Two credential routes. 1Password is the primary one; a fork or a repo
      # that has not been given OP_SERVICE_ACCOUNT_TOKEN can instead set plain
      # ANTHROPIC_API_KEY / OPENAI_API_KEY repository secrets. The `secrets`
      # context is NOT available in a step-level `if:`, so presence has to be
      # resolved into a step output first -- `steps` context is available.
      - name: Resolve credential route
        id: creds
        env:
          OP_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -u
          if [ -n "${OP_TOKEN:-}" ]; then
            echo "op=true" >> "$GITHUB_OUTPUT"
            echo "Credential route: 1Password (OP_SERVICE_ACCOUNT_TOKEN is set)."
          else
            echo "op=false" >> "$GITHUB_OUTPUT"
            echo "Credential route: plain repository secrets (no OP_SERVICE_ACCOUNT_TOKEN)."
          fi

      - name: Load provider API keys from 1Password
        if: steps.creds.outputs.op == 'true'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANTHROPIC_API_KEY: op://Infrastructure/anthropic-api-key/credential
          OPENAI_API_KEY: op://Infrastructure/openai-api-key/credential

      - name: Run the live panel
        env:
          FIXTURE: ${{ inputs.fixture }}
          MODELS: ${{ inputs.models }}
          MAX_USD: ${{ inputs.max_usd }}
          JUDGE: ${{ inputs.judge }}
          PRICES: ${{ inputs.prices }}
          # Deliberately DISTINCT names. A step-level env entry called
          # ANTHROPIC_API_KEY would shadow the value the 1Password step wrote
          # to GITHUB_ENV (explicit step/job env wins over GITHUB_ENV), so the
          # two routes must not share a variable name. The shell below prefers
          # whatever is already exported and falls back to these.
          ANTHROPIC_API_KEY_FALLBACK: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY_FALLBACK: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -u
          # 1Password route (if it ran) already exported these; otherwise take
          # the plain repository secret. A provider still missing a key is
          # skipped and reported by the CLI, not a failure.
          : "${ANTHROPIC_API_KEY:=${ANTHROPIC_API_KEY_FALLBACK:-}}"
          : "${OPENAI_API_KEY:=${OPENAI_API_KEY_FALLBACK:-}}"
          export ANTHROPIC_API_KEY OPENAI_API_KEY
          case "$FIXTURE" in
            mini) dir=test/fixtures/mini; tools=tools.json; truth=truth.md; reqs=requests.json ;;
            neumann-before) dir=test/fixtures/neumann; tools=tools-before.json; truth=truth-before.md; reqs=requests-before.json ;;
            neumann-after) dir=test/fixtures/neumann; tools=tools-after.json; truth=truth-after.md; reqs=requests-after.json ;;
            *) echo "unknown fixture: $FIXTURE" >&2; exit 64 ;;
          esac
          args=(run --tools "$dir/$tools" --truth "$dir/$truth" --requests "$dir/$reqs"
                --models "$MODELS" --max-usd "$MAX_USD" --out eval-out)
          if [ -n "$JUDGE" ]; then args+=(--judge "$JUDGE"); fi
          if [ -n "$PRICES" ]; then printf '%s' "$PRICES" > "$RUNNER_TEMP/prices.json"; args+=(--prices "$RUNNER_TEMP/prices.json"); fi
          set +e
          node bin/aux-comprehension-test.mjs "${args[@]}"
          code=$?
          set -e
          # 0 pass, 1 conditional, 2 fail are results; 3 refused and 64 usage are not.
          if [ "$code" -ge 3 ]; then exit "$code"; fi

      - name: Upload run directory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-panel-${{ inputs.fixture }}
          path: eval-out
          if-no-files-found: ignore
